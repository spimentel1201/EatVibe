server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URI:http://localhost:8088}
          predicates:
            - Path=/auth/**
            
        - id: restaurant-service
          uri: ${RESTAURANT_SERVICE_URI:http://localhost:8082}
          predicates:
            - Path=/api/v1/restaurants/**
          filters:
            - AuthenticationFilter
            
        - id: order-service
          uri: ${ORDER_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/api/v1/orders/**
          filters:
            - AuthenticationFilter
            
        - id: courier-service
          uri: ${COURIER_SERVICE_URI:http://localhost:8086}
          predicates:
            - Path=/api/v1/couries/**
          filters:
            - AuthenticationFilter
            
        - id: payment-service
          uri: ${PAYMENT_SERVICE_URI:http://localhost:8085}
          predicates:
            - Path=/api/v1/payments/**
          filters:
            - AuthenticationFilter

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    reactor.netty: INFO
