server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URI:http://localhost:8088}
          predicates:
            - Path=/auth/**
            
        - id: restaurant-service
          uri: ${RESTAURANT_SERVICE_URI:http://localhost:8082}
          predicates:
            - Path=/api/v1/restaurants/**
          filters:
            - AuthenticationFilter
            
        - id: order-service
          uri: ${ORDER_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/api/v1/orders/**
          filters:
            - AuthenticationFilter
            
        - id: cart-service
          uri: ${ORDER_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/api/v1/cart/**
          filters:
            - AuthenticationFilter
            
        - id: courier-service
          uri: ${COURIER_SERVICE_URI:http://localhost:8086}
          predicates:
            - Path=/api/v1/couriers/**
          filters:
            - AuthenticationFilter
            
        - id: delivery-service
          uri: ${COURIER_SERVICE_URI:http://localhost:8086}
          predicates:
            - Path=/api/v1/deliveries/**
          filters:
            - AuthenticationFilter
            
        - id: payment-methods-service
          uri: ${PAYMENT_SERVICE_URI:http://localhost:8085}
          predicates:
            - Path=/api/v1/payment-methods/**
          filters:
            - AuthenticationFilter
            
        - id: payment-service
          uri: ${PAYMENT_SERVICE_URI:http://localhost:8085}
          predicates:
            - Path=/api/v1/payments/**
          filters:
            - AuthenticationFilter
            - name: CircuitBreaker
              args:
                name: paymentServiceCircuitBreaker
                fallbackUri: forward:/fallback/payment

        - id: storage-service
          uri: ${STORAGE_SERVICE_URI:http://localhost:8089}
          predicates:
            - Path=/api/v1/storage/**
          filters:
            - AuthenticationFilter

      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3000"
              - "http://localhost:5173" # Vite default
              - "http://localhost:8081" # React Native Bundler
              - "http://10.0.2.2:8081"  # Android Emulator
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH
            allowedHeaders: "*"
            allowCredentials: true

jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10000
        permittedNumberOfCallsInHalfOpenState: 3
        registerHealthIndicator: true
    instances:
      paymentServiceCircuitBreaker:
        baseConfig: default

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    reactor.netty: INFO
