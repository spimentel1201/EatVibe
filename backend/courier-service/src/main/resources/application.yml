server:
  port: 8086

spring:
  application:
    name: courier-service
  
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/courier_db}
    username: ${DB_USERNAME:foodrush}
    password: ${DB_PASSWORD:foodrush_dev_2026}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.spatial.dialect.postgis.PostgisDialect
        format_sql: true
        show_sql: false
    open-in-view: false
  
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    validate-on-migrate: true
  
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:courier-service-group}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

# Geolocation Configuration
geolocation:
  max-assignment-radius-km: ${MAX_ASSIGNMENT_RADIUS_KM:10}
  geofence-radius-meters: ${GEOFENCE_RADIUS_METERS:100}
  location-update-throttle-seconds: ${LOCATION_UPDATE_THROTTLE:5}

# WebSocket Configuration
websocket:
  allowed-origins: ${WEBSOCKET_ALLOWED_ORIGINS:*}
  heartbeat-interval-ms: ${WEBSOCKET_HEARTBEAT_INTERVAL:10000}

# Kafka Topics
kafka:
  topics:
    courier-events: ${KAFKA_TOPIC_COURIER_EVENTS:courier-events}
    delivery-events: ${KAFKA_TOPIC_DELIVERY_EVENTS:delivery-events}
    location-updates: ${KAFKA_TOPIC_LOCATION_UPDATES:location-updates}
    order-events: ${KAFKA_TOPIC_ORDER_EVENTS:order-events}

# Logging
logging:
  level:
    root: ${LOG_LEVEL:INFO}
    com.foodrush.courier: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.kafka: INFO

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

# Swagger/OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  show-actuator: true
