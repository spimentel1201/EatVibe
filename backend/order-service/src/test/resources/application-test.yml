spring:
  application:
    name: order-service-test
  
  # H2 Database para tests
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  
  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
  
  # Flyway disabled for tests (using ddl-auto)
  flyway:
    enabled: false
  
  # Redis Configuration (embedded)
  data:
    redis:
      host: localhost
      port: 6379
  
  # Kafka Configuration (mocked in tests)
  kafka:
    bootstrap-servers: localhost:9092

# Logging
logging:
  level:
    root: INFO
    com.foodrush.order: DEBUG
