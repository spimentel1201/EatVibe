server:
  port: 8085

spring:
  application:
    name: payment-service
  
  # Database Configuration
  datasource:
    url: jdbc:postgresql://localhost:5432/payments_db
    username: foodrush
    password: foodrush_dev_2026
    driver-class-name: org.postgresql.Driver
  
  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  
  # Flyway Configuration
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  
  # Kafka Configuration
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: payment-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

# Payment Gateway Configuration
payment:
  stripe:
    api-key: ${STRIPE_API_KEY:sk_test_dummy_key}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:whsec_dummy_secret}
  yape:
    enabled: true
    simulation-mode: true

# Kafka Topics and Consumer Config
kafka:
  topics:
    payment-events: payment-events
    order-events: order-events
    refund-events: refund-events
  consumer:
    group-id: payment-service-group

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

# Swagger Configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

# Logging
logging:
  level:
    root: INFO
    com.foodrush.payment: DEBUG
    org.springframework.kafka: INFO
