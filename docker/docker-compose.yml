version: '3.8'

services:
  # ====================
  # PostgreSQL + PostGIS
  # ====================
  postgres:
    image: postgis/postgis:15-3.3
    container_name: foodrush-postgres
    environment:
      POSTGRES_USER: foodrush
      POSTGRES_PASSWORD: foodrush_dev_2026
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../backend/.docs/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - foodrush-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foodrush"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ====================
  # pgAdmin (Opcional)
  # ====================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: foodrush-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@foodrush.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    networks:
      - foodrush-network
    depends_on:
      - postgres

  # ====================
  # Redis
  # ====================
  redis:
    image: redis:7-alpine
    container_name: foodrush-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - foodrush-network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ====================
  # Zookeeper (para Kafka)
  # ====================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: foodrush-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - foodrush-network

  # ====================
  # Apache Kafka
  # ====================
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: foodrush-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    networks:
      - foodrush-network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5

  # ====================
  # Kafka UI (Opcional)
  # ====================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: foodrush-kafka-ui
    depends_on:
      - kafka
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: foodrush-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9093
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      - foodrush-network

networks:
  foodrush-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
